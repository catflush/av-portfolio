{{ $p := . }}
<article class="card">
  <a class="card-link" href="{{ $p.RelPermalink }}" aria-labelledby="t-{{ $p.RelPermalink | urlize }}">
    {{ with $p.Params.cover }}
      <div class="card-media">
        <img src="{{ . | relURL }}" alt="{{ $p.Params.coverAlt | default "" }}" loading="lazy" decoding="async" width="800" height="500">
      </div>
    {{ else }}
      <div class="card-media card-media--placeholder" aria-hidden="true">
        <span>{{ substr $p.Title 0 1 }}</span>
      </div>
    {{ end }}
    <div class="card-body">
      <h2 class="card-title" id="t-{{ $p.RelPermalink | urlize }}">{{ $p.Title }}</h2>
      {{ with $p.Params.summary | default $p.Summary }}<p class="card-summary">{{ . }}</p>{{ end }}
      {{ with $p.Params.tags }}
        <ul class="card-tags" aria-label="Tags">
          {{ range . }}<li>{{ . }}</li>{{ end }}
        </ul>
      {{ end }}
    </div>
  </a>
</article>
