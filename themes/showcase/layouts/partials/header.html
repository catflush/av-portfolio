<header class="site-header" role="banner">
  <div class="container header-inner">
    <div class="header-left">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} — home">
        <span class="brand-name">{{ site.Title }}</span>
      </a>
    </div>
    
    <div class="header-center">
      <nav id="primary-nav" class="site-nav" aria-label="Primary">
        <ul>
          {{ range site.Menus.main }}
          <li>
            <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
          {{ end }}
        </ul>
      </nav>
    </div>

    <div class="header-right">
      <button class="theme-toggle" id="theme-toggle-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-label-dark" style="font-weight: 600; font-size: 0.9rem;">Dark</span>
        <span class="theme-label-light" style="font-weight: 600; font-size: 0.9rem;">Light</span>
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <span class="visually-hidden">Toggle menu</span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
